[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# پلاگین asyncio
asyncio_mode = auto

# نمایش بهتر
addopts =
    -v
    --tb=short
    --strict-markers
    --color=yes

# markerها
markers =
    network: تست نیاز به شبکه دارد
    slow: تست کند (>5 ثانیه)

# نادیده گرفتن
norecursedirs =
    venv
    .venv
    __pycache__
    storage
    data