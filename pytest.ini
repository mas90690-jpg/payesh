# ======================================================================
#  pytest.ini — تنها منبع config برای pytest
#
#  ⚠️  چرا اینجا و نه pyproject.toml؟
#      pytest اول pytest.ini را می‌خواند و اگر موجود باشد،
#      [tool.pytest.ini_options] در pyproject.toml نادیده گرفته می‌شود.
#      پس نگه‌داشتن هر دو = dead code.
# ======================================================================

[pytest]

# ─── مسیرها ───
pythonpath = .
testpaths = tests

# ─── پوشه‌هایی که pytest نباید بگردد ───
norecursedirs =
    .git
    .venv
    venv
    env
    __pycache__
    storage
    data
    backups
    DeepSeek
    *.egg-info
    .pytest_cache
    .mypy_cache
    .ruff_cache
    htmlcov

# ─── async (تست‌های asyncio) ───
asyncio_mode = auto

# ─── آرگومان‌های پیش‌فرض ───
addopts =
    -v
    --tb=short
    --strict-markers
    --import-mode=importlib

# ─── هشدارهای نادیده ───
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

# ─── مارکرهای سفارشی ───
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests that need network/DB