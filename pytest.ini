; ═══════════════════════════════════════════════════════════════════
;  pytest.ini — تنظیمات pytest برای Srooyesh Lead-Monitor
;  نسخه: 1.1.0
;
;  اجرا:
;    pytest                    → همهٔ تست‌ها
;    pytest -m "not slow"      → بدون تست‌های کند
;    pytest -m db              → فقط تست‌های DB
;    pytest --cov=core         → با coverage
;    pytest -v -x              → توقف در اولین خطا
; ═══════════════════════════════════════════════════════════════════

[pytest]
; ─── مسیرها ───
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

; ─── رفتار ───
; -ra: خلاصهٔ نتایج (skipped, failed, errors)
; -q:  کم‌حرف‌تر (می‌توانی با -v غیرفعال کنی)
; --strict-config: خطا در صورت کلید ناشناخته در ini
; --strict-markers: خطا در صورت استفاده از marker تعریف‌نشده
; --tb=short: traceback کوتاه‌تر
; --disable-warnings: پنهان‌کردن هشدارهای پکیج‌های ثالث
addopts =
    -ra
    --strict-config
    --strict-markers
    --tb=short
    --disable-warnings

; ─── asyncio ───
; auto: همهٔ تست‌های async را خودکار با asyncio اجرا کن
; (نیازی به @pytest.mark.asyncio روی هر تست نیست)
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

; ─── timeout ───
; اگر pytest-timeout نصب باشد، هر تست حداکثر ۶۰ ثانیه
timeout = 60
timeout_method = thread

; ─── markers ───
; هر marker باید این‌جا تعریف شود، وگرنه --strict-markers خطا می‌دهد
markers =
    db: تست‌های دیتابیس (SQLite/PostgreSQL)
    slow: تست‌های کند (> ۵ ثانیه)
    integration: تست‌های یکپارچگی (نیاز به سرویس واقعی)
    network: تست‌هایی که به اینترنت نیاز دارند
    browser: تست‌هایی که Playwright لازم دارند
    ai: تست‌هایی که به Ollama/DeepSeek نیاز دارند
    unit: تست‌های واحد (سریع، بدون I/O)

; ─── لاگ ───
; نمایش لاگ در صورت شکست تست
log_cli = false
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(name)s: %(message)s
log_cli_date_format = %H:%M:%S
log_file = storage/logs/pytest.log
log_file_level = DEBUG
log_file_format = %(asctime)s [%(levelname)s] %(name)s: %(message)s
log_file_date_format = %Y-%m-%d %H:%M:%S

; ─── coverage (اختیاری — فقط اگر pytest-cov نصب باشد) ───
; با `pytest --cov` فعال می‌شود
; [coverage:run]
; source = core, analyzers, collectors, handlers
; omit =
;     */tests/*
;     */venv/*
;     */__pycache__/*
; [coverage:report]
; exclude_lines =
;     pragma: no cover
;     if __name__ == .__main__.: